[package]
name = "cix3752ilabelloader"
version = "0.1.6"
description = "面單貼標加載器"
authors = ["RD-CAT"]
edition = "2021"

[lib]
name = "cix3752ilabelloader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = ["dialog-open"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# TLS 一律用 ring：Linux 版在 Ubuntu 20.04（GCC 9、無 cmake）打包，reqwest 預設的 aws-lc 後端在那裡編不過；
# 不帶後端的 reqwest 改用程序層級的預設後端，由 lib.rs 在啟動時安裝 ring，漏裝會在建立 HTTP client 時 panic
reqwest = { version = "0.13", features = ["json", "query", "rustls-no-provider"], default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["fs"] }

[features]
# Tauri v1 強制要求：production 建置會啟用此 feature
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
